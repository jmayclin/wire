[package]
name = "brass-aphid-wire-decryption"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "utilities to do runtime decryption of TLS conversations, and helpers for popular TLS libraries"

[dependencies]
byteorder = "1.5.0"
serde = { version = "1.0", features = ["derive"]}
serde_json = "1.0"
serde_with = "3.12.0"

tracing-appender = "0.2"
tracing-subscriber = "0.3" 
tracing = "0.1.40"

strum = { version = "0.25", features = ["derive"] }

# Internal dependencies
brass-aphid-wire-macros = { version = "0.0.2", path = "../brass-aphid-wire-macros" }
brass-aphid-wire-messages = { version = "0.0.3", path = "../brass-aphid-wire-messages" }
anyhow = "1.0.98"
errno = "0.3"
libc = "0.2.174"
aes-gcm = "0.10.3"
chacha20poly1305 = "0.10.1"
hex = "0.4.3"
openssl = {version = "0.10.73", features = ["vendored"]}
# s2n-tls = {version = "0.3.21", features = ["unstable-testing"]}
# s2n-tls-sys = "0.3.21"

s2n-tls = { version = "0.3.21", path = "/home/ubuntu/workspace/s2n-tls/bindings/rust/extended/s2n-tls", features = ["unstable-testing"]}
s2n-tls-sys = { version = "0.3.21", path = "/home/ubuntu/workspace/s2n-tls/bindings/rust/extended/s2n-tls-sys"}

rustls = "0.23.29"
openssl-sys = "0.9.109"

############################ rust crypto crates ################################
digest = "0.11.0-rc.9"
sha2 = "0.11.0-rc.4"

hkdf = "0.13.0-rc.4"
hmac = "0.13.0-rc.4"

p256 = "0.14.0-rc.6"
p384 = "0.14.0-rc.6"
elliptic-curve = "0.14.0-rc.24"
ecdsa = "0.17.0-rc.14"
signature = "3.0.0-rc.9"

[dev-dependencies]
tokio = { version = "1.48.0", features = ["full"] }
s2n-tls-tokio = { version = "0.3.21", path = "/home/ubuntu/workspace/s2n-tls/bindings/rust/extended/s2n-tls-tokio"}

[build-dependencies]
serde_with = "3.12.0"
