[package]
name = "brass-aphid-wire-record"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
brass-aphid-wire-macros = { version = "0.0.4", path = "../brass-aphid-wire-macros" }
brass-aphid-wire-messages = { version = "0.0.5", path = "../brass-aphid-wire-messages" }

chacha20poly1305 = "0.11.0"
aes-gcm = "0.10.3"

hmac = "0.13.0"
digest = "0.11.0-rc.9"

sha2 = "0.11.0"
hkdf = "0.13.0"
hex = "0.4.3"
s2n-tls-sys = "0.3.43"

[dev-dependencies]
s2n-tls = {version = "0.3.43", features = ["unstable-testing"]}
# vendored: build our own OpenSSL, never link against the system one
openssl = { version = "0.10.73", features = ["vendored"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
